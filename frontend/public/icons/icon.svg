<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#27272a" stroke-width="4"/>

  <!-- Golden Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="12" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="162" fill="#09090b" opacity="0.8"/>

  <!-- Barber Pole & Scissors Emblem -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Barber Shears / Scissors (cross) -->
    <!-- Blade 1 -->
    <path d="M-60,70 C-40,40 -20,10 0,-30 L30,-110 C32,-116 28,-122 22,-120 L5,-115 C-2,-70 -30,-20 -60,10 C-75,2,-100,5 -115,22 C-135,45 -130,80 -105,100 C-82,118 -55,100 -60,70 Z M-95,65 C-105,55 -102,40 -90,32 C-78,25 -65,32 -62,45 C-59,58 -70,72 -80,72 C-86,72 -91,69 -95,65 Z" fill="url(#goldGrad)"/>
    
    <!-- Blade 2 -->
    <path d="M60,70 C40,40 20,10 0,-30 L-30,-110 C-32,-116 -28,-122 -22,-120 L-5,-115 C2,-70 30,-20 60,10 C75,2 100,5 115,22 C135,45 130,80 105,100 C82,118 55,100 60,70 Z M95,65 C105,55 102,40 90,32 C78,25 65,32 62,45 C59,58 70,72 80,72 C86,72 91,69 95,65 Z" fill="url(#goldGrad)"/>

    <!-- Central Pivot Screw -->
    <circle cx="0" cy="-20" r="14" fill="#18181b" stroke="url(#goldGrad)" stroke-width="4"/>
    <circle cx="0" cy="-20" r="5" fill="#fbbf24"/>

    <!-- Crown / Star Accent -->
    <path d="M0,-140 L8,-125 L24,-125 L12,-115 L16,-100 L0,-110 L-16,-100 L-12,-115 L-24,-125 L-8,-125 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography / Brand Ribbon -->
  <text x="256" y="390" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" letter-spacing="4" fill="#f4f4f5">SOFTBARBER</text>
  <text x="256" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="6" fill="#f59e0b">VIP CLUB</text>
</svg>
